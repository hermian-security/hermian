[package]
name = "hermian"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Silent by default. Loud when it matters. Lightweight defensive security daemon for Linux."

[[bin]]
name = "hermian"
path = "src/main.rs"

[dependencies]
hermian-core = { path = "../hermian-core" }
aya = { version = "0.13", features = ["async_tokio"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
anyhow = "1"
libc = "0.2"
hostname = "0.4"
sha2 = "0.10"
hex = "0.4"
inotify = "0.11"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
