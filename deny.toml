# cargo-deny: known vulnerabilities, licenses and dependency sources.
# Run: cargo deny check

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# hermian-ebpf builds for bpfel-unknown-none only.
exclude = ["hermian-ebpf"]

[advisories]
# Unmaintained crates are reported, not failed: a fix often needs an
# upstream release first. Vulnerabilities always fail.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Exactly what the current tree uses; a new license shows up as a failure to
# look at, not something already waved through.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
