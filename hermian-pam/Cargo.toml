[package]
name = "hermian-pam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pam_hermian"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"

[dev-dependencies]
