# Installed by HERMIAN. Persistence monitoring relies on inotify; the kernel
# default (8192 watches on older kernels, ~1% of RAM on newer ones) is easily
# exhausted by a single file-watching application, which would silently blind
# the daemon. These values are conservative and cost ~1 KiB per watch in use.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
