title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Something you'd like Hermian to catch, say or do? Start with the problem: it helps us find the right fix, which isn't always the one in mind.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What happened, or what you couldn't do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: A detection, an option, a message, anything.
