name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # The vendored eBPF object is compared byte for byte with a fresh build, so
  # the toolchain that builds it is pinned. Bump together with bpf-linker and
  # commit the rebuilt object in the same PR (see PROJECT.md).
  HERMIAN_EBPF_NIGHTLY: nightly-2026-09-17

jobs:
  # Docs-only PRs skip the build jobs. Skipped jobs still satisfy required
  # checks; skipping the whole workflow (paths-ignore) would leave them
  # pending forever. Pushes always run everything: the release gate wants
  # every required check green on the tagged commit. If this job fails, the
  # builds run anyway.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            printf '%s\n' "$files"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$)'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  harness:
    name: validation harness (non-root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.8'
      - name: Lint workflow definitions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml
      - run: python3 -B -m unittest discover -s tests/helpers -p 'test_*.py' -v
      - run: sh -n tests/attacks/run_attack.sh
      - run: sh -n tests/run_suite.sh
      - run: sh -n tests/false_positives/run_false_positive.sh
      - run: sh -n tests/helpers/disposable_host.sh
      - name: sh -n on soak scripts
        run: for f in tests/soak/start.sh tests/soak/report.sh tests/soak/metrics.sh tests/soak/hermian-soak-snapshot; do sh -n "$f"; done
      - name: sh -n on packaging scripts
        run: for f in packaging/install.sh packaging/debian/postinst packaging/debian/prerm packaging/debian/postrm; do sh -n "$f"; done

  core:
    name: core (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Skipped per step, not per job: a skipped matrix job reports its check
    # without the matrix value, so 'core (ubuntu-latest)' would never arrive.
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: env.CODE != 'false'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - if: env.CODE != 'false'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - if: env.CODE != 'false'
        run: cargo fmt --all -- --check
      - if: env.CODE != 'false'
        run: cargo clippy -p hermian-core --all-targets --locked -- -D warnings
      - if: env.CODE != 'false'
        run: cargo test -p hermian-core --locked

  linux:
    name: daemon + eBPF (linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: ${{ env.HERMIAN_EBPF_NIGHTLY }}
          components: rust-src
      - run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libpam
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      # bpf-linker via `cargo install` needs a matching system LLVM (21+),
      # which no runner image has. The project publishes static musl binaries
      # with LLVM bundled; use those.
      # Pinned by checksum as well as version: this binary runs with the
      # job's permissions and produces the object we compare against.
      - name: Install bpf-linker (prebuilt, static)
        env:
          BPF_LINKER_VERSION: v0.11.1
          BPF_LINKER_SHA256: e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8
        run: |
          curl -fsSL "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst" -o /tmp/bl.tar.zst
          echo "${BPF_LINKER_SHA256}  /tmp/bl.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/bl.tar.zst -C /usr/local/bin bpf-linker
          bpf-linker --version
      # Build the eBPF object from source and refuse the vendored fallback, so a
      # stale hermian-ebpf/prebuilt/hermian-ebpf.o fails CI instead of shipping.
      - run: HERMIAN_EBPF_FROM_SOURCE=1 cargo clippy --all-targets --locked -- -D warnings
      - run: HERMIAN_EBPF_FROM_SOURCE=1 cargo test --release --locked
      - name: nft accepts the isolation ruleset
        run: |
          sudo apt-get install -y nftables
          BIN=$(HERMIAN_EBPF_FROM_SOURCE=1 cargo test --release --locked -p hermian --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | head -1)
          test -n "$BIN"
          sudo "$BIN" --ignored --exact isolate::tests::nft_accepts_the_ruleset
          sudo "$BIN" --ignored --exact blocklist::tests::nft_accepts_the_block_table
          # Really adds/lists/removes blocks, in a private network namespace.
          sudo unshare -n "$BIN" --ignored --exact blocklist::tests::live_block_list_unblock
      - run: HERMIAN_EBPF_FROM_SOURCE=1 cargo build --release --locked
      - name: Vendored eBPF object is current
        run: |
          OBJ=$(find target/release/build -path '*/ebpf-target/bpfel-unknown-none/release/hermian-ebpf' | head -1)
          cmp "$OBJ" hermian-ebpf/prebuilt/hermian-ebpf.o
      - name: Smoke-test the binary
        run: |
          ./target/release/hermian --version
          HERMIAN_COLOR=never ./target/release/hermian test
      # Unit tests can't load eBPF; this puts the object through the runner
      # kernel's verifier and checks the LD_PRELOAD scan end to end.
      - name: Load the eBPF object (verifier + live exec event)
        run: |
          BIN=$(HERMIAN_EBPF_FROM_SOURCE=1 cargo test --release --locked -p hermian --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | head -1)
          test -n "$BIN"
          uname -r
          sudo "$BIN" --ignored --test-threads=1 ebpf::tests::
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermian-linux-amd64
          path: |
            target/release/hermian
            target/release/libpam_hermian.so

  # arm64 used to be built only at release time, so arch-specific lints (c_char
  # is u8 there, i8 on x86_64) failed the release instead of the PR. Not a
  # required check; the release workflow still gates on the five above.
  arm64:
    name: clippy (arm64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install libpam
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      # Same command as the release's arm64 build, with the vendored eBPF object.
      - run: HERMIAN_EBPF_FROM_SOURCE=0 cargo clippy --release --locked --all-targets -- -D warnings

  # Advisory for now: not in the required-check set (that's a repository
  # setting). Known vulnerabilities, yanked crates, licenses, sources.
  supply-chain:
    name: supply chain (cargo-deny)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check

  # The declared rust-version must keep building.
  msrv:
    name: msrv (1.91)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.91"
      - name: Install libpam
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: HERMIAN_EBPF_FROM_SOURCE=0 cargo check --workspace --all-targets --locked
