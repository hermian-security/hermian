name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match tag to workspace version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected = "v" + version
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match workspace version {expected!r}")
          PY
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

  ebpf:
    name: Build eBPF object from source
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bpf-linker (prebuilt, static)
        env:
          BPF_LINKER_VERSION: v0.11.1
        run: |
          curl -fsSL "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst" -o /tmp/bl.tar.zst
          sudo tar --zstd -xf /tmp/bl.tar.zst -C /usr/local/bin bpf-linker
          bpf-linker --version
      - name: Build and compare with vendored object
        run: |
          HERMIAN_EBPF_FROM_SOURCE=1 cargo build --release -p hermian
          OBJ=$(find target/release/build -path '*/ebpf-target/bpfel-unknown-none/release/hermian-ebpf' | head -1)
          cp "$OBJ" hermian-ebpf.o
          if ! cmp -s hermian-ebpf.o hermian-ebpf/prebuilt/hermian-ebpf.o; then
            echo "::error::hermian-ebpf/prebuilt/hermian-ebpf.o is stale; rebuild and commit it"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ebpf
          path: hermian-ebpf.o

  build:
    name: Build ${{ matrix.arch }}
    needs: ebpf
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04        # oldest glibc we support (2.35)
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: ebpf
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: cargo install cargo-deb --locked
      - name: Build
        env:
          HERMIAN_EBPF_PREBUILT: ${{ github.workspace }}/hermian-ebpf.o
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo test  --release --locked --target ${{ matrix.target }} -p hermian-core
          ./target/${{ matrix.target }}/release/hermian --version
          HERMIAN_COLOR=never ./target/${{ matrix.target }}/release/hermian test
      - name: Package .deb
        env:
          HERMIAN_EBPF_PREBUILT: ${{ github.workspace }}/hermian-ebpf.o
        run: |
          cargo deb -p hermian --no-build --target ${{ matrix.target }} -o dist/
          ls -la dist
      - name: Package tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DIR=hermian-${VERSION}-linux-${{ matrix.arch }}
          mkdir -p dist/$DIR
          cp target/${{ matrix.target }}/release/hermian dist/$DIR/
          cp target/${{ matrix.target }}/release/libpam_hermian.so dist/$DIR/
          cp packaging/install.sh LICENSE README.md dist/$DIR/
          tar -C dist -czf dist/$DIR.tar.gz $DIR
          rm -rf dist/$DIR
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # Sigstore keyless signing, only for the publishing job
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@v3
      - name: Checksums and Sigstore signatures
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          for f in *.tar.gz *.deb SHA256SUMS; do
            cosign sign-blob --yes "$f" --bundle "$f.sigstore"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Verify before installing

            Every artifact is signed with Sigstore (keyless, identity bound to this
            repository's release workflow). Verify the checksum file, then the
            checksums:

            ```bash
            cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            Then install:

            ```bash
            sudo apt install ./hermian_*_amd64.deb      # Debian/Ubuntu
            # or
            tar xzf hermian-*-linux-amd64.tar.gz && cd hermian-*-linux-amd64 && sudo sh install.sh
            ```
