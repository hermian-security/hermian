name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Match tag to workspace version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected = "v" + version
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match workspace version {expected!r}")
          PY
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

  ebpf:
    name: Build eBPF object from source
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          components: rust-src
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install bpf-linker (prebuilt, static)
        env:
          BPF_LINKER_VERSION: v0.11.1
          BPF_LINKER_SHA256: e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8
        run: |
          curl -fsSL "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst" -o /tmp/bl.tar.zst
          echo "${BPF_LINKER_SHA256}  /tmp/bl.tar.zst" | sha256sum -c -
          sudo tar --zstd -xf /tmp/bl.tar.zst -C /usr/local/bin bpf-linker
          bpf-linker --version
      - name: Build and compare with vendored object
        run: |
          HERMIAN_EBPF_FROM_SOURCE=1 cargo build --release --locked -p hermian
          OBJ=$(find target/release/build -path '*/ebpf-target/bpfel-unknown-none/release/hermian-ebpf' | head -1)
          cp "$OBJ" hermian-ebpf.o
          if ! cmp -s hermian-ebpf.o hermian-ebpf/prebuilt/hermian-ebpf.o; then
            echo "::error::hermian-ebpf/prebuilt/hermian-ebpf.o is stale; rebuild and commit it"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ebpf
          path: hermian-ebpf.o

  build:
    name: Build ${{ matrix.arch }}
    needs: ebpf
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04        # oldest glibc we support (2.35)
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ebpf
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      # Same version beta.3 was packaged with; bump deliberately.
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - name: Build
        env:
          HERMIAN_EBPF_PREBUILT: ${{ github.workspace }}/hermian-ebpf.o
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          cargo test  --release --locked --target ${{ matrix.target }} -p hermian-core
          ./target/${{ matrix.target }}/release/hermian --version
          HERMIAN_COLOR=never ./target/${{ matrix.target }}/release/hermian test
      - name: Package .deb
        env:
          HERMIAN_EBPF_PREBUILT: ${{ github.workspace }}/hermian-ebpf.o
        run: |
          cargo deb -p hermian --no-build --target ${{ matrix.target }} -o dist/
          # GitHub Releases can't serve '~' in asset names (cargo-deb uses it
          # for prereleases). Rename so SHA256SUMS matches the download URL.
          for f in dist/*.deb; do
            [ -f "$f" ] || continue
            g=${f//\~/.}
            [ "$f" = "$g" ] || mv "$f" "$g"
          done
          ls -la dist
      - name: Package tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DIR=hermian-${VERSION}-linux-${{ matrix.arch }}
          mkdir -p dist/$DIR
          cp target/${{ matrix.target }}/release/hermian dist/$DIR/
          cp target/${{ matrix.target }}/release/libpam_hermian.so dist/$DIR/
          cp packaging/install.sh LICENSE README.md dist/$DIR/
          tar -C dist -czf dist/$DIR.tar.gz $DIR
          rm -rf dist/$DIR
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*

  release:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # Sigstore keyless signing and build attestations
      attestations: write   # gh attestation verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Checksums and Sigstore signatures
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS
          for f in *.tar.gz *.deb SHA256SUMS; do
            cosign sign-blob --yes "$f" --bundle "$f.sigstore"
          done
          ls -la
      # Provenance for every file in SHA256SUMS, checked with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      # Install commands live only in the README at this tag; the notes are
      # the CHANGELOG section for this version plus a pointer there.
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=${TAG#v}
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          {
            echo
            echo "## Install"
            echo
            echo "Follow the [install steps for this release](https://github.com/$REPO/blob/$TAG/README.md#install)"
            echo "with \`VER=$TAG\`. They cover Debian/Ubuntu, other systemd distros,"
            echo "checking where the files came from (\`gh\` or \`cosign\`), and upgrading."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
          body_path: notes.md
