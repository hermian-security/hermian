[workspace]
members = ["hermian-core", "hermian", "hermian-ebpf", "hermian-pam"]
# hermian-ebpf is a bpfel-unknown-none target built by hermian/build.rs; it must
# never be compiled for the host, so it is excluded from plain `cargo build`/`test`.
default-members = ["hermian-core", "hermian", "hermian-pam"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.5"
edition = "2021"
license = "Apache-2.0"
# Oldest stable that builds the locked dependency tree (cargo-platform needs
# 1.91). CI checks it; raise it on purpose, not by accident.
rust-version = "1.91"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# On purpose: with unwinding, a panicking collector thread or notifier task
# dies alone and the daemon runs on half-blind without saying so. Aborting
# brings systemd's restart and the "unclean shutdown" page, which quotes the
# panic (heartbeat::install_panic_note). Tests always unwind regardless.
panic = "abort"
strip = "symbols"
debug = 0

[profile.dev]
panic = "abort"
debug = 0
